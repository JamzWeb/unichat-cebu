<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniChat Cebu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .message-bubble {
            transition: transform 0.2s ease;
        }
        /* Official Reaction picker popup style */
        .reaction-menu {
            display: none;
            position: absolute;
            bottom: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 9999px;
            padding: 4px 8px;
            gap: 6px;
            z-index: 20;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .message-bubble:hover .reaction-menu {
            display: flex;
        }
        /* Custom scrollbar for chat and dropdowns */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #020617;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col justify-between">

    <!-- HEADER / ONLINE COUNT BADGE & CROWN BUTTON -->
    <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
        <div class="flex items-center space-x-2">
            <h1 class="font-bold text-emerald-400 tracking-wider text-sm">UniChat Cebu 🎓</h1>
            <!-- Secret Staff Login Button -->
            <button onclick="openAuthModal()" title="Staff Login" class="text-slate-400 hover:text-amber-400 transition text-xs bg-slate-900 border border-slate-800 px-2 py-1 rounded">👑</button>
        </div>
        
        <div class="flex items-center space-x-2">
            <button onclick="openFeedbackModal()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded-lg border border-slate-700 transition">Feedback</button>
            
            <div id="onlineBadge" class="flex items-center space-x-1.5 bg-slate-900 border border-emerald-500/30 text-emerald-400 px-2.5 py-1 rounded-full text-xs font-mono">
                <span class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></span>
                <span>Online: <strong id="onlineCountNum" class="text-white">0</strong></span>
            </div>
        </div>
    </header>

    <!-- SETUP & CHAT CONTAINER -->
    <main class="flex-1 overflow-y-auto p-4 flex flex-col space-y-3" id="chatMessages">
        
        <!-- Initial Setup Screen -->
        <div id="setupScreen" class="max-w-md mx-auto my-auto bg-slate-900 border border-slate-800 p-6 rounded-xl flex flex-col space-y-4 shadow-xl w-full">
            <h2 class="text-lg font-bold text-emerald-400 text-center">Welcome to UniChat Cebu!</h2>
            <p class="text-xs text-slate-400 text-center">Connect with students across campuses and regional branches around Cebu.</p>
            
            <div class="flex flex-col space-y-1">
                <label class="text-xs text-slate-400">Nickname:</label>
                <input type="text" id="nicknameInput" placeholder="Enter your nickname..." class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>

            <div class="flex flex-col space-y-1">
                <label class="text-xs text-slate-400">University / Campus Branch:</label>
                <select id="schoolSelect" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500 max-h-48 overflow-y-auto">
                    <!-- A to Z Alphabetical Campus & Branch List -->
                    <option value="ACLC-Mandaue">ACLC-Mandaue</option>
                    <option value="ACT-Bulacao">ACT-Bulacao</option>
                    <option value="ACT-Cyber Tower 2">ACT-Cyber Tower 2</option>
                    <option value="ACT-Main">ACT-Main</option>
                    <option value="ACT-Pit-os">ACT-Pit-os</option>
                    <option value="AMA-Cebu">AMA-Cebu</option>
                    <option value="Benedicto-Cebu City">Benedicto-Cebu City</option>
                    <option value="Benedicto-Mandaue">Benedicto-Mandaue</option>
                    <option value="CDU">CDU</option>
                    <option value="CEC">CEC</option>
                    <option value="CIC-Cebu">CIC-Cebu</option>
                    <option value="CIM">CIM</option>
                    <option value="CIT-U">CIT-U</option>
                    <option value="CNU-Balamban">CNU-Balamban</option>
                    <option value="CNU-Main">CNU-Main</option>
                    <option value="CNU-Medellin">CNU-Medellin</option>
                    <option value="CRMC">CRMC</option>
                    <option value="CTU-Argao">CTU-Argao</option>
                    <option value="CTU-Barili">CTU-Barili</option>
                    <option value="CTU-Carmen">CTU-Carmen</option>
                    <option value="CTU-Daanbantayan">CTU-Daanbantayan</option>
                    <option value="CTU-Danao">CTU-Danao</option>
                    <option value="CTU-Main">CTU-Main</option>
                    <option value="CTU-Moalboal">CTU-Moalboal</option>
                    <option value="CTU-Naga">CTU-Naga</option>
                    <option value="CTU-San Fernando">CTU-San Fernando</option>
                    <option value="CTU-San Francisco">CTU-San Francisco</option>
                    <option value="FRVMF">FRVMF</option>
                    <option value="IAU">IAU</option>
                    <option value="iACADEMY-Cebu">iACADEMY-Cebu</option>
                    <option value="Informatics-Cebu">Informatics-Cebu</option>
                    <option value="LCC-Lapu-Lapu">LCC (Lapu-Lapu City College)</option>
                    <option value="LCC-Liloan">LCC-Liloan</option>
                    <option value="MCC-Mandaue">MCC (Mandaue City College)</option>
                    <option value="NCCI">NCCI</option>
                    <option value="SCC-Carcar / Talisay">SCC-Carcar / Talisay</option>
                    <option value="SCSIT-Main">SCSIT-Main</option>
                    <option value="SCSIT-Talisay">SCSIT-Talisay</option>
                    <option value="SPCFI-Mandaue">SPCFI-Mandaue</option>
                    <option value="SPCFI-Ramos">SPCFI-Ramos</option>
                    <option value="SRCC-Bogo">SRCC-Bogo</option>
                    <option value="STC-Cebu">STC-Cebu</option>
                    <option value="STI-Cebu">STI-Cebu</option>
                    <option value="St. Louise">St. Louise</option>
                    <option value="SWU PHINMA">SWU PHINMA</option>
                    <option value="TCC-Talisay">TCC (Talisay City College)</option>
                    <option value="UC-Banilad">UC-Banilad</option>
                    <option value="UC-Main">UC-Main</option>
                    <option value="UC-METC">UC-METC</option>
                    <option value="UC-Pardo-Talisay">UC-Pardo-Talisay</option>
                    <option value="UC-UCLM">UC-UCLM</option>
                    <option value="UP-Cebu Lahug">UP Cebu-Lahug</option>
                    <option value="UP-Cebu SRP">UP Cebu-SRP</option>
                    <option value="USC-Downtown">USC-Downtown</option>
                    <option value="USC-North">USC-North</option>
                    <option value="USC-South">USC-South</option>
                    <option value="USC-Talamban">USC-Talamban</option>
                    <option value="USJ-R Basak">USJ-R Basak</option>
                    <option value="USJ-R Main">USJ-R Main</option>
                    <option value="USPF">USPF</option>
                    <option value="UV-Compostela">UV-Compostela</option>
                    <option value="UV-Dalaguete">UV-Dalaguete</option>
                    <option value="UV-Danao">UV-Danao</option>
                    <option value="UV-GCM">UV-GCM</option>
                    <option value="UV-Main">UV-Main</option>
                    <option value="UV-Mandaue">UV-Mandaue</option>
                    <option value="UV-Minglanilla">UV-Minglanilla</option>
                    <option value="UV-Toledo">UV-Toledo</option>
                    <option value="Velez">Velez</option>
                    <option value="Other School/Branch">Other School / Branch</option>
                </select>
            </div>

            <button id="findBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg text-sm transition">Find Stranger</button>
        </div>
    </main>

    <!-- INTERACTION AREA (Hidden until matched) -->
    <div id="chatFooter" class="p-4 bg-slate-900 border-t border-slate-800 flex flex-col space-y-2 hidden">
        
        <!-- Typing Indicator -->
        <div id="typingIndicator" class="text-xs text-slate-400 italic h-4 hidden">
            Stranger is typing...
        </div>

        <!-- Reply Preview Banner -->
        <div id="replyPreviewContainer" class="hidden flex justify-between items-center bg-slate-800 px-3 py-1.5 rounded-md text-xs border-l-4 border-emerald-400">
            <div>
                <span class="text-emerald-400 font-semibold">Replying to:</span>
                <p id="replyPreviewText" class="text-slate-300 truncate max-w-xs"></p>
            </div>
            <button id="cancelReplyBtn" class="text-slate-400 hover:text-white font-bold px-1">✕</button>
        </div>

        <div class="flex space-x-2">
            <input type="text" id="messageInput" placeholder="Type a message..." class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
            <button id="sendBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">Send</button>
            <button id="skipBtn" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-semibold">Skip / Leave</button>
        </div>
    </div>

    <!-- STAFF AUTHENTICATION MODAL -->
    <div id="authModal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl max-w-sm w-full space-y-4 shadow-xl">
            <h3 class="text-sm font-bold text-amber-400 text-center">👑 Staff & Moderator Access</h3>
            <p class="text-xs text-slate-400 text-center">Enter your assigned staff or admin password.</p>
            
            <input type="password" id="staffPassInput" placeholder="Enter password..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
            
            <div class="flex space-x-2">
                <button onclick="loginAsStaff()" class="flex-1 bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2 rounded-lg text-sm">Login</button>
                <button onclick="closeAuthModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm">Cancel</button>
            </div>
        </div>
    </div>

    <!-- FEEDBACK / REPORT MODAL -->
    <div id="feedbackModal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl max-w-md w-full space-y-4">
            <h3 class="text-sm font-bold text-emerald-400">Send Feedback, Bug Report, or User Report</h3>
            
            <select id="feedbackType" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                <option value="suggestion">💡 Suggestion / Feature Request</option>
                <option value="bug">🐛 Report a Bug</option>
                <option value="report">⚠️ Report a Bad User / Chat Issue</option>
            </select>

            <textarea id="feedbackMsg" rows="3" placeholder="Describe your report or feedback..." class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-emerald-500"></textarea>

            <div class="flex space-x-2">
                <button onclick="submitFeedbackForm()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 rounded-lg text-sm">Submit</button>
                <button onclick="closeFeedbackModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm">Cancel</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
                  </html>
