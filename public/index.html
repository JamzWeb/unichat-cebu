<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNICHAT - Cebu University Text Chat</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom Neon Theme Styles -->
  <link rel="stylesheet" href="style.css">
   <style>
      .message-bubble { transition: transform 0.2s ease; margin-top: 12px; margin-bottom: 12px; }
      .reaction-menu {
          display: none;
          position: absolute;
          bottom: 100%;
          margin-bottom: 6px;
          background: #18181b;
          border: 1px solid #27272a;
          border-radius: 9999px;
          padding: 3px 8px;
          gap: 6px;
          z-index: 50;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.8);
      }
      .message-bubble:hover .reaction-menu { display: flex; }
  </style>
</head>
<body class="bg-black text-slate-100 font-sans antialiased h-screen overflow-hidden flex flex-col">

  <!-- ================= VIEW 1: AUTH & SETUP ================= -->
  <div id="authView" class="flex h-full w-full items-center justify-center bg-gradient-to-br from-black via-zinc-950 to-emerald-950/40 p-4 absolute inset-0 z-50 overflow-y-auto">
    <div class="w-full max-w-md p-8 rounded-2xl bg-zinc-950/90 border border-emerald-500/30 neon-border-green backdrop-blur-md">
      
      <div class="text-center mb-8">
        <h1 class="text-4xl font-extrabold tracking-wider bg-gradient-to-r from-emerald-400 via-green-300 to-emerald-500 bg-clip-text text-transparent neon-text-green">
          UNICHAT
        </h1>
        <p class="text-xs text-emerald-500/80 font-mono mt-1">CEBU CAMPUS TEXT DIRECT</p>
      </div>

      <form id="setupForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-emerald-400 mb-2">Nickname <span class="text-zinc-500 font-normal lowercase">(no emojis allowed)</span></label>
          <input type="text" id="nicknameInput" required placeholder="e.g., SugboKing" 
            class="w-full px-4 py-3 bg-zinc-900/90 border border-zinc-800 rounded-xl focus:outline-none focus:border-emerald-500 text-slate-200 placeholder-zinc-600 text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-emerald-400 mb-2">Your University / Campus</label>
          <!-- Find your school select element in index.html and remove the 'required' attribute, or update it to this: -->
<select id="schoolSelect" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-zinc-200 focus:outline-none focus:border-emerald-500">
    <option value="" disabled selected>Select Cebu Campus...</option>
            <optgroup label="── A to C ──">
                <option value="ACLC College - Mandaue">ACLC College - Mandaue</option>
                <option value="Asian College of Technology (ACT) - Cebu">ACT - Cebu</option>
                <option value="Cebu Institute of Technology - University (CIT-U)">CIT-U</option>
                <option value="Cebu Normal University (CNU) - Main">CNU - Main</option>
                <option value="Cebu Roosevelt Memorial Colleges (CRMC)"> CRMC</option>
                <option value="Cebu Technological University (CTU) - Argao">CTU - Argao</option>
                <option value="Cebu Technological University (CTU) - Barili">CTU - Barili</option>
                <option value="Cebu Technological University (CTU) - Daanbantayan">CTU - Daanbantayan</option>
                <option value="Cebu Technological University (CTU) - Danao">CTU - Danao</option>
                <option value="Cebu Technological University (CTU) - Main">CTU - Main</option>
                <option value="Cebu Technological University (CTU) - Moalboal">CTU - Moalboal</option>
                <option value="Cebu Technological University (CTU) - San Francisco">CTU - San Francisco</option>
                <option value="Cebu Technological University (CTU) - Tuburan">CTU - Tuburan</option>
            </optgroup>
            <optgroup label="── D to S ──">
                <option value="Don Bosco Technical College - Cebu">Don Bosco Technical College - Cebu</option>
                <option value="Southwestern University (SWU) PHINMA - Cebu"> SWU PHINMA - Cebu</option>
            </optgroup>
            <optgroup label="── U (Universities) ──">
                <option value="University of Cebu (UC) - Banilad">UC - Banilad</option>
                <option value="University of Cebu (UC) - Lapu-Lapu and Mandaue">UC - Lapu-Lapu and Mandaue</option>
                <option value="University of Cebu (UC) - Main">UC - Main</option>
                <option value="University of Cebu (UC) - Pardo">UC - Pardo</option>
                <option value="University of San Carlos (USC) - North Campus">USC - North Campus</option>
                <option value="University of San Carlos (USC) - South Campus">USC - South Campus</option>
                <option value="University of San Carlos (USC) - Talamban">USC - Talamban</option>
                <option value="University of San Carlos (USC) - Downtown Main">USC - Downtown Main</option>
                <option value="University of San Jose-Recoletos (USJ-R) - Basak"> USJ-R - Basak</option>
                <option value="University of San Jose-Recoletos (USJ-R) - Main">USJ-R - Main</option>
                <option value="University of the Philippines (UP) - Cebu">UP - Cebu</option>
                <option value="University of the Visayas (UV) - Main">UV - Main</option>
            </optgroup>
            <optgroup label="── Others ──">
                <option value="Other School / Branch Around Cebu">Other School / Branch Around Cebu</option>
            </optgroup>
          </select>
        </div>

        <div class="flex items-center gap-2 pt-1">
          <input type="checkbox" id="adminToggle" onchange="toggleAdminPasswordBox()" class="accent-emerald-500 h-4 w-4 rounded border-zinc-800 bg-zinc-900">
          <label for="adminToggle" class="text-xs text-zinc-400 select-none">Join with <span class="text-amber-400 font-bold">👑 Staff Badge (Admin/Mod Password)</span></label>
        </div>

        <div id="adminPasswordContainer" class="hidden space-y-2 pt-1">
          <label class="block text-xs font-semibold uppercase tracking-wider text-amber-400">Staff Password Verification</label>
          <input type="password" id="adminPasswordInput" placeholder="Enter staff/admin password..." 
            class="w-full px-4 py-3 bg-zinc-900/90 border border-amber-500/50 rounded-xl focus:outline-none focus:border-amber-400 text-amber-200 placeholder-zinc-600 text-sm">
        </div>

        <button type="submit" 
          class="w-full py-3.5 rounded-xl font-bold text-black bg-gradient-to-r from-emerald-400 via-green-400 to-emerald-500 hover:from-emerald-300 transition-all shadow-[0_0_20px_rgba(34,197,94,0.4)] text-sm tracking-wide">
          START MATCHING
        </button>
      </form>
    </div>
  </div>

  <!-- ================= VIEW 2: CHAT INTERFACE ================= -->
  <div id="chatView" class="hidden h-full w-full flex-col bg-zinc-950 flex-1 overflow-hidden">
    
    <header class="h-16 bg-black border-b border-emerald-950/60 px-6 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <span class="text-xl font-extrabold bg-gradient-to-r from-emerald-400 to-green-300 bg-clip-text text-transparent neon-text-green">UNICHAT</span>
        <span class="text-xs px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 font-mono">
          Online: <strong id="onlineCountNum">0</strong>
        </span>
      </div>
      <div class="flex items-center gap-3">
        <button id="adminPanelBtn" onclick="toggleAdminDrawer()" style="display: none;" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-500/20 text-amber-400 border border-amber-500/40 hover:bg-amber-500/30 transition-all z-30">
          <i class="fa-solid fa-shield-halved me-1"></i> Staff Dashboard
        </button>
        <button onclick="leaveChat()" class="text-xs text-zinc-500 hover:text-rose-400 transition-colors">Exit Session</button>
      </div>
    </header>

    <div class="flex-1 min-h-0 flex relative overflow-hidden">
      
      <div class="flex-1 flex flex-col min-h-0 bg-gradient-to-b from-black via-zinc-950 to-black">
        <div class="h-12 bg-zinc-950/80 border-b border-zinc-900 px-6 flex items-center justify-between text-xs text-zinc-400 shrink-0">
          <div>Matched Partner: <span id="partnerInfo" class="font-bold text-slate-200">Finding stranger...</span></div>
          <button onclick="reportCurrentPartner()" class="text-rose-500/80 hover:text-rose-400 text-xs flex items-center gap-1">
            <i class="fa-solid fa-flag"></i> Report
          </button>
        </div>

        <!-- Reply Preview Banner -->
        <div id="replyPreviewContainer" class="hidden mx-6 mt-2 bg-zinc-900 border-l-4 border-emerald-400 px-3 py-1.5 rounded-r-lg flex justify-between items-center text-xs">
          <div>
            <span class="text-emerald-400 font-semibold">Replying to:</span>
            <p id="replyPreviewText" class="text-zinc-300 truncate max-w-xs"></p>
          </div>
          <button id="cancelReplyBtn" onclick="cancelReply()" class="text-zinc-500 hover:text-white font-bold px-1">✕</button>
        </div>

        <div id="messageStream" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 min-h-0">
          <div class="text-center my-2">
            <span class="inline-block bg-zinc-900/80 border border-zinc-800 text-zinc-500 text-[11px] px-4 py-1.5 rounded-full font-mono">
              Connected to Cebu Peer Engine. Be respectful & enjoy!
            </span>
          </div>
        </div>

        <div class="p-4 bg-black border-t border-zinc-900 flex gap-3 shrink-0">
          <button onclick="skipPartner()" class="px-4 py-3 rounded-xl font-bold bg-zinc-900 hover:bg-zinc-800 text-rose-400 border border-zinc-800 text-xs">SKIP</button>
          <input type="text" id="chatInput" placeholder="Type a message (Click any message to reply)..." class="flex-1 px-4 py-3 bg-zinc-900/90 border border-zinc-800 rounded-xl focus:outline-none focus:border-emerald-500 text-slate-200 text-sm">
          <button onclick="sendMessage()" class="px-6 py-3 rounded-xl font-bold bg-emerald-500 hover:bg-emerald-400 text-black text-xs">SEND</button>
        </div>
      </div>

      <!-- Admin / Moderator Drawer -->
      <div id="adminDrawer" style="display: none;" class="absolute right-0 top-0 bottom-0 w-80 bg-zinc-950 border-l border-zinc-800 flex flex-col p-4 z-40 shadow-2xl">
        <div class="flex items-center justify-between pb-4 border-b border-zinc-800 shrink-0">
          <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider">🛡️ Staff Console</h3>
          <button onclick="toggleAdminDrawer()" class="text-zinc-500 hover:text-white p-2"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto py-4 space-y-4 min-h-0" id="adminDrawerContent">
          <div id="adminCredentialSection" class="hidden space-y-2 bg-zinc-900 p-3 rounded-lg border border-amber-500/30 text-xs">
            <h4 class="font-bold text-amber-400">👑 Credential Manager</h4>
            <select id="targetAccountSelect" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-white">
                <option value="admin">Master Admin Account</option>
                <option value="1">Moderator Slot 1</option>
                <option value="2">Moderator Slot 2</option>
                <option value="3">Moderator Slot 3</option>
                <option value="4">Moderator Slot 4</option>
                <option value="5">Moderator Slot 5</option>
            </select>
            <input type="text" id="newStaffUser" placeholder="New Username" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-white">
            <input type="password" id="newStaffPass" placeholder="New Password" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-white">
            <button onclick="submitStaffUpdate()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2 rounded">Save Changes</button>
          </div>

          <div class="space-y-2">
            <h4 class="font-bold text-rose-400 text-xs">Reports Log</h4>
            <div id="adminReportList" class="space-y-2">
              <div class="text-xs text-zinc-500 text-center py-4">No reports recorded.</div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
  </html>
