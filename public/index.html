<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNICHAT - Cebu University Text Chat</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom Neon Theme Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-slate-100 font-sans antialiased h-screen overflow-hidden flex flex-col">

  <!-- ================= VIEW 1: AUTH & SETUP ================= -->
  <div id="authView" class="flex h-full w-full items-center justify-center bg-gradient-to-br from-black via-zinc-950 to-emerald-950/40 p-4 absolute inset-0 z-50 overflow-y-auto">
    <div class="w-full max-w-md p-8 rounded-2xl bg-zinc-950/90 border border-emerald-500/30 neon-border-green backdrop-blur-md">
      
      <div class="text-center mb-8">
        <h1 class="text-4xl font-extrabold tracking-wider bg-gradient-to-r from-emerald-400 via-green-300 to-emerald-500 bg-clip-text text-transparent neon-text-green">
          UNICHAT
        </h1>
        <p class="text-xs text-emerald-500/80 font-mono mt-1">CEBU CAMPUS TEXT DIRECT</p>
      </div>

      <form id="setupForm" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-emerald-400 mb-2">Nickname <span class="text-zinc-500 font-normal lowercase">(no emojis allowed)</span></label>
          <input type="text" id="nicknameInput" required placeholder="e.g., SugboKing" 
            class="w-full px-4 py-3 bg-zinc-900/90 border border-zinc-800 rounded-xl focus:outline-none focus:border-emerald-500 text-slate-200 placeholder-zinc-600 text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-emerald-400 mb-2">Your University</label>
          <select id="schoolSelect" required 
            class="w-full px-4 py-3 bg-zinc-900/90 border border-zinc-800 rounded-xl focus:outline-none focus:border-emerald-500 text-slate-200 text-sm max-h-48 overflow-y-auto">
            <option value="" disabled selected>Select Cebu Campus...</option>
            <optgroup label="── A to C ──">
                <option value="ACLC College - Mandaue">ACLC College - Mandaue</option>
                <option value="Asian College of Technology (ACT) - Cebu">Asian College of Technology (ACT) - Cebu</option>
                <option value="Cebu Institute of Technology - University (CIT-U)">Cebu Institute of Technology - University (CIT-U)</option>
                <option value="Cebu Normal University (CNU) - Main">Cebu Normal University (CNU) - Main</option>
                <option value="Cebu Roosevelt Memorial Colleges (CRMC)">Cebu Roosevelt Memorial Colleges (CRMC)</option>
                <option value="Cebu Technological University (CTU) - Argao">Cebu Technological University (CTU) - Argao</option>
                <option value="Cebu Technological University (CTU) - Barili">Cebu Technological University (CTU) - Barili</option>
                <option value="Cebu Technological University (CTU) - Daanbantayan">Cebu Technological University (CTU) - Daanbantayan</option>
                <option value="Cebu Technological University (CTU) - Danao">Cebu Technological University (CTU) - Danao</option>
                <option value="Cebu Technological University (CTU) - Main">Cebu Technological University (CTU) - Main</option>
                <option value="Cebu Technological University (CTU) - Moalboal">Cebu Technological University (CTU) - Moalboal</option>
                <option value="Cebu Technological University (CTU) - San Francisco">Cebu Technological University (CTU) - San Francisco</option>
                <option value="Cebu Technological University (CTU) - Tuburan">Cebu Technological University (CTU) - Tuburan</option>
            </optgroup>
            <optgroup label="── D to S ──">
                <option value="Don Bosco Technical College - Cebu">Don Bosco Technical College - Cebu</option>
                <option value="Ginatilan National High School">Ginatilan National High School</option>
                <option value="Southwestern University (SWU) PHINMA - Cebu">Southwestern University (SWU) PHINMA - Cebu</option>
            </optgroup>
            <optgroup label="── U (Universities) ──">
                <option value="University of Cebu (UC) - Banilad">University of Cebu (UC) - Banilad</option>
                <option value="University of Cebu (UC) - Lapu-Lapu and Mandaue">University of Cebu (UC) - Lapu-Lapu and Mandaue</option>
                <option value="University of Cebu (UC) - Main">University of Cebu (UC) - Main</option>
                <option value="University of Cebu (UC) - Pardo">University of Cebu (UC) - Pardo</option>
                <option value="University of San Carlos (USC) - North Campus">University of San Carlos (USC) - North Campus</option>
                <option value="University of San Carlos (USC) - South Campus">University of San Carlos (USC) - South Campus</option>
                <option value="University of San Carlos (USC) - Talamban">University of San Carlos (USC) - Talamban</option>
                <option value="University of San Carlos (USC) - Downtown Main">University of San Carlos (USC) - Downtown Main</option>
                <option value="University of San Jose-Recoletos (USJ-R) - Basak">University of San Jose-Recoletos (USJ-R) - Basak</option>
                <option value="University of San Jose-Recoletos (USJ-R) - Main">University of San Jose-Recoletos (USJ-R) - Main</option>
                <option value="University of the Philippines (UP) - Cebu">University of the Philippines (UP) - Cebu</option>
                <option value="University of the Visayas (UV) - Main">University of the Visayas (UV) - Main</option>
            </optgroup>
            <optgroup label="── Others ──">
                <option value="Other School / Branch Around Cebu">Other School / Branch Around Cebu</option>
            </optgroup>
          </select>
        </div>

        <div class="flex items-center gap-2 pt-1">
          <input type="checkbox" id="adminToggle" onchange="toggleAdminPasswordBox()" class="accent-emerald-500 h-4 w-4 rounded border-zinc-800 bg-zinc-900">
          <label for="adminToggle" class="text-xs text-zinc-400 select-none">Log in as <span class="text-emerald-400 font-bold">Admin Account</span></label>
        </div>

        <div id="adminPasswordContainer" class="hidden space-y-2 pt-1">
          <label class="block text-xs font-semibold uppercase tracking-wider text-emerald-400">Admin Secret Password</label>
          <input type="password" id="adminPasswordInput" placeholder="Enter admin password..." 
            class="w-full px-4 py-3 bg-zinc-900/90 border border-emerald-500/50 rounded-xl focus:outline-none focus:border-emerald-400 text-emerald-200 placeholder-zinc-600 text-sm">
        </div>

        <button type="submit" 
          class="w-full py-3.5 rounded-xl font-bold text-black bg-gradient-to-r from-emerald-400 via-green-400 to-emerald-500 hover:from-emerald-300 transition-all shadow-[0_0_20px_rgba(34,197,94,0.4)] text-sm tracking-wide">
          START MATCHING
        </button>
      </form>
    </div>
  </div>

  <!-- ================= VIEW 2: CHAT INTERFACE ================= -->
  <div id="chatView" class="hidden h-full w-full flex-col bg-zinc-950 flex-1 overflow-hidden">
    
    <header class="h-16 bg-black border-b border-emerald-950/60 px-6 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <span class="text-xl font-extrabold bg-gradient-to-r from-emerald-400 to-green-300 bg-clip-text text-transparent neon-text-green">UNICHAT</span>
        <span class="text-xs px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 font-mono">Online</span>
      </div>
      <div class="flex items-center gap-3">
        <button id="adminPanelBtn" onclick="toggleAdminDrawer()" style="display: none;" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 hover:bg-emerald-500/30 transition-all z-30">
          <i class="fa-solid fa-shield-halved me-1"></i> Admin Console
        </button>
        <button onclick="leaveChat()" class="text-xs text-zinc-500 hover:text-rose-400 transition-colors">Exit Session</button>
      </div>
    </header>

    <div class="flex-1 min-h-0 flex relative overflow-hidden">
      
      <div class="flex-1 flex flex-col min-h-0 bg-gradient-to-b from-black via-zinc-950 to-black">
        <div class="h-12 bg-zinc-950/80 border-b border-zinc-900 px-6 flex items-center justify-between text-xs text-zinc-400 shrink-0">
          <div>Matched Partner: <span id="partnerInfo" class="font-bold text-slate-200">Finding stranger...</span></div>
          <button onclick="reportCurrentPartner()" class="text-rose-500/80 hover:text-rose-400 text-xs flex items-center gap-1">
            <i class="fa-solid fa-flag"></i> Report
          </button>
        </div>

        <div id="messageStream" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 min-h-0">
          <div class="text-center my-2">
            <span class="inline-block bg-zinc-900/80 border border-zinc-800 text-zinc-500 text-[11px] px-4 py-1.5 rounded-full font-mono">
              Connected to Cebu Peer Engine. Be respectful & enjoy!
            </span>
          </div>
        </div>

        <div class="p-4 bg-black border-t border-zinc-900 flex gap-3 shrink-0">
          <button onclick="skipPartner()" class="px-4 py-3 rounded-xl font-bold bg-zinc-900 hover:bg-zinc-800 text-rose-400 border border-zinc-800 text-xs">SKIP</button>
          <input type="text" id="chatInput" placeholder="Type a message..." class="flex-1 px-4 py-3 bg-zinc-900/90 border border-zinc-800 rounded-xl focus:outline-none focus:border-emerald-500 text-slate-200 text-sm">
          <button onclick="sendMessage()" class="px-6 py-3 rounded-xl font-bold bg-emerald-500 hover:bg-emerald-400 text-black text-xs">SEND</button>
        </div>
      </div>

      <div id="adminDrawer" style="display: none;" class="absolute right-0 top-0 bottom-0 w-80 bg-zinc-950 border-l border-zinc-800 flex-col p-4 z-40 shadow-2xl">
        <div class="flex items-center justify-between pb-4 border-b border-zinc-800 shrink-0">
          <h3 class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Reports Console</h3>
          <button onclick="toggleAdminDrawer()" class="text-zinc-500 hover:text-white p-2"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto py-4 space-y-3 min-h-0" id="adminReportList">
          <div class="p-3 bg-zinc-900/80 rounded-lg border border-zinc-800 text-xs space-y-2">
            <div class="flex justify-between text-zinc-400">
              <span class="font-bold text-slate-200">Anon_Cebu</span>
              <span class="text-emerald-500">CIT-U</span>
            </div>
            <p class="text-zinc-500 italic">"Spamming unsolicited links"</p>
            <div class="flex justify-end gap-2 pt-1">
              <button onclick="this.parentElement.parentElement.remove()" class="px-2 py-1 bg-zinc-800 text-zinc-400 rounded">Dismiss</button>
              <button onclick="alert('User Banned'); this.parentElement.parentElement.remove();" class="px-2 py-1 bg-rose-600 text-white rounded">Ban</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
